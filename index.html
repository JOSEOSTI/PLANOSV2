<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MBA3 - Mapeo de Planos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src='https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js'></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <link rel="stylesheet" href="./css/custom.css">

</head>

<body>

    <div class="container-fluid text-center">
        <div class="btn-group pt-2" role="group" aria-label="Button group with nested dropdown">
            <button type="button" class="btn btn-secondary" onclick="zoom_mas()">Zoom +</button>
            <button type="button" class="btn btn-secondary" onclick="zoom_menos()">Zoom -</button>
            <button type="button" class="btn btn-secondary" onclick="zoom_default()">
                <i class="fa-solid fa-magnifying-glass"></i> 1:1
            </button>
            <button type="button" class="btn btn-secondary" onclick="show_plane('diagrama')">Diagrama</button>
            <button type="button" class="btn btn-secondary" onclick="show_plane('fotografia')">Fotografía</button>
            <button type="button" class="btn btn-secondary" onclick="show_plane('mixto')">Mixto</button>
            <button type="button" class="btn btn-secondary" onclick="send_ubic()">Mapear</button>
            <div class="btn-group" role="group">
                <button id="btnGroupDrop1" type="button" class="btn btn-secondary dropdown-toggle"
                    data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                    Dropdown
                </button>
                <div class="dropdown-menu" aria-labelledby="btnGroupDrop1">
                    <a class="dropdown-item" href="#">Dropdown link</a>
                    <a class="dropdown-item" href="#">Dropdown link</a>
                </div>
            </div>
        </div>
        <!-- CONTENEDOR DIAGRAMA -->
        <div id="fp-canvas-container" class="fp-canvas-container">
            <div class="zoom-wrapper" id="zoom-wrapper-diagrama">

                <img src="" class="img-fluid fp-img" id="fp-img" usemap="#fp-map">
                <!-- Overlay layer para diagrama -->
                <div id="overlay-layer-diagrama" class="overlay-layer">
                </div>
            </div>
        </div>

        <!-- CONTENEDOR FOTOGRAFÍA -->
        <div id="fp-canvas-container2" class="fp-canvas-container2">
            <div class="zoom-wrapper" id="zoom-wrapper-fotografia">
                <img src="" class="img-fluid fp-img2" id="fp-img2" usemap="#fp-map2">
                <!-- Overlay layer para fotografía -->
                <div id="overlay-layer-fotografia" class="overlay-layer">
                </div>
            </div>
        </div>

        <!-- Contenedor Mixto (3 y 4 en fila) -->
        <div class="row justify-content-around mt-3" id="pl_mixto">
            <!-- Contenedor 3 -->
            <div class="col-6">
                <div id="fp-canvas-container3" class="fp-canvas-container">
                    <img src="" class="img-fluid fp-img3" id="fp-img3" usemap="#fp-map3">
                    <div id="overlay-layer-mixto-A"
                        style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;">
                    </div>
                </div>
            </div>

            <!-- Contenedor 4 -->
            <div class="col-6">
                <div id="fp-canvas-container4" class="fp-canvas-container">
                    <img src="" class="img-fluid fp-img4" id="fp-img4" usemap="#fp-map4">
                    <div id="overlay-layer-mixto-B"
                        style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;">
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>


    <!-- === PEGA TU CÓDIGO JAVASCRIPT AQUÍ === -->
    <script>
        const script = document.createElement("script");
        script.src = "js/script.js?v=" + new Date().getTime();
        document.body.appendChild(script);
    </script>
    <!-- <script src="js/operacion.js"></script> -->

</body>

</html>
